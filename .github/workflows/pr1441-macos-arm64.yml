name: PR 1441 macOS ARM64 DMG

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or branch to build
        required: true
        default: c1267987293ee4d3d92f3e92930cbca741f190c0
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 DMG
    runs-on: macos-latest
    steps:
      - name: Checkout PR 1441 source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate macOS icons
        run: pnpm build:icon
        env:
          PLATFORM: macos-latest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build DMG
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eco-paste-pr1441-arm64-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: EcoPaste PR 1441 ARM64 build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Test build of EcoPaste PR #1441 for Apple Silicon (macOS ARM64).

            Source commit: `${{ github.sha }}`

            This is an unsigned community test build. It is not an official EcoPaste release.
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
